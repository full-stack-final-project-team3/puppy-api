name: Deploy Spring Application to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check current directory and list files
        run: |
          pwd
          ls -la

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Make directory for deliver
        run: mkdir -p deploy

      - name: Write the application.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      ## springboot 도커 이미지 빌드 후 도커허브에 push하기
      - name: Build and push Docker image
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
          docker build --file ./Dockerfile --no-cache -t kimjuseong/backend:latest .
          docker push kimjuseong/backend:latest

      # 도커 허브에서 jar파일 및 pull
      - name: Deploy to Dev
        uses: appleboy/ssh-action@master
        with:
          username: ec2-user
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Docker login..."
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
            
            echo "Writing the docker-compose.yml"
            echo "${{ secrets.DOCKER_COMPOSE_YML }}" > ./docker-compose.yml
            
            echo "Stopping existing container..."
            docker-compose down || true
            
            echo "Removing existing Docker image..."
            docker rmi kimjuseong/backend:latest || true
            
            echo "Pulling Docker image..."
            docker pull kimjuseong/backend:latest
            
            echo "Starting new container…"
            
            docker-compose up -d 
            docker ps
